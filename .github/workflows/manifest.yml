name: Update patcher manifests

on:
  push:
    branches: [main]
    paths:
      - 'BNet.Cafe.Server/**'
      - 'BNet.Cafe.Client/**'
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifests
        run: |
          # Each line: <git blob sha> TAB <path relative to the app folder>
          for pair in "BNet.Cafe.Server:server" "BNet.Cafe.Client:client"; do
            dir="${pair%%:*}"
            name="${pair##*:}"
            esc="${dir//./\\.}"
            git -c core.quotepath=false ls-tree -r HEAD "$dir" \
              | sed -E "s#^[0-9]+ blob ([0-9a-f]+)\t${esc}/#\1\t#" \
              > "${name}-manifest.txt"
            [ -s "${name}-manifest.txt" ] || { echo "ERROR: ${name}-manifest.txt is empty"; exit 1; }
            echo "${name}: $(wc -l < "${name}-manifest.txt") files"
          done

      - name: Commit manifests if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server-manifest.txt client-manifest.txt
          git diff --staged --quiet || (git commit -m "Update patcher manifests" && git push)
